[project]
name = "eventor-mailchimp-sync"
version = "0.1.0"
description = "Keep a Mailchimp audience in sync with an orienteering club's Eventor members and event entrants."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Justin Stafford" }]
keywords = ["orienteering", "eventor", "mailchimp", "sync"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Other Audience",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.scripts]
eventor-mailchimp-sync = "eventor_mailchimp_sync.cli:main"

[project.urls]
Repository = "https://github.com/JustinStafford/eventor-mailchimp-sync"
"Eventor API spec" = "https://github.com/orienteering-oss/eventor-api-openapi-spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventor_client", "src/eventor_mailchimp_sync"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE", "config.example.toml", ".env.example"]

[dependency-groups]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "PIE", "ISC"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:eventor_client", "error::DeprecationWarning:eventor_mailchimp_sync"]
