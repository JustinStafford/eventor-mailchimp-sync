# Scheduled Eventor -> Mailchimp sync for a club's PRIVATE runner repository.
#
# Copy this file to .github/workflows/sync.yml in a private repository that
# contains nothing but this workflow and, optionally, a config.toml with your
# event-series tag mappings. The tool itself is installed straight from the
# public repository at the ref in TOOL_REF, so there is no code to maintain.
#
# Secrets (Settings > Secrets and variables > Actions > Secrets):
#   EVENTOR_API_KEY, MAILCHIMP_API_KEY, MAILCHIMP_LIST_ID
# Variables (same page > Variables), all optional:
#   TOOL_REF                    tag or commit of the tool to run (default main)
#   SYNC_PERSONS_CONTACT_INDEX  true to include lapsed members who still enter
#   SYNC_REDACT                 true to mask names and emails in logs and the report
#   EVENTOR_BASE_URL, SYNC_WINDOW_MONTHS, SYNC_PREVIOUS_YEAR_UNTIL_MONTH,
#   SYNC_MEMBER_SOURCE, SYNC_REQUIRE_PAID, SYNC_MEMBER_TAG, SYNC_ENTRANT_TAG,
#   SYNC_INCLUDE_STARTS, SYNC_UPDATE_NAMES, MAILCHIMP_MERGE_CLUB,
#   MAILCHIMP_MERGE_MEMBERSHIP_YEAR, MAILCHIMP_MERGE_EVENTOR_ID,
#   MAILCHIMP_MERGE_MOBILE, SYNC_PHONE_COUNTRY_CODE
# Unset variables arrive as empty strings and mean "use the default"; the
# literal value none switches a feature off.

name: Sync Mailchimp audience

on:
  schedule:
    # GitHub cron is UTC only. 16:07 UTC is 02:07 AEST (03:07 during AEDT).
    - cron: "7 16 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes to Mailchimp (untick for a dry run)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: eventor-mailchimp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVENTOR_BASE_URL: ${{ vars.EVENTOR_BASE_URL }}
      EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
      MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
      MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
      MAILCHIMP_SERVER_PREFIX: ${{ vars.MAILCHIMP_SERVER_PREFIX }}
      SYNC_WINDOW_MONTHS: ${{ vars.SYNC_WINDOW_MONTHS }}
      SYNC_PREVIOUS_YEAR_UNTIL_MONTH: ${{ vars.SYNC_PREVIOUS_YEAR_UNTIL_MONTH }}
      SYNC_MEMBER_SOURCE: ${{ vars.SYNC_MEMBER_SOURCE }}
      SYNC_REQUIRE_PAID: ${{ vars.SYNC_REQUIRE_PAID }}
      SYNC_MEMBER_TAG: ${{ vars.SYNC_MEMBER_TAG }}
      SYNC_ENTRANT_TAG: ${{ vars.SYNC_ENTRANT_TAG }}
      SYNC_INCLUDE_STARTS: ${{ vars.SYNC_INCLUDE_STARTS }}
      SYNC_PERSONS_CONTACT_INDEX: ${{ vars.SYNC_PERSONS_CONTACT_INDEX }}
      SYNC_UPDATE_NAMES: ${{ vars.SYNC_UPDATE_NAMES }}
      MAILCHIMP_MERGE_CLUB: ${{ vars.MAILCHIMP_MERGE_CLUB }}
      MAILCHIMP_MERGE_MEMBERSHIP_YEAR: ${{ vars.MAILCHIMP_MERGE_MEMBERSHIP_YEAR }}
      MAILCHIMP_MERGE_EVENTOR_ID: ${{ vars.MAILCHIMP_MERGE_EVENTOR_ID }}
      MAILCHIMP_MERGE_MOBILE: ${{ vars.MAILCHIMP_MERGE_MOBILE }}
      SYNC_PHONE_COUNTRY_CODE: ${{ vars.SYNC_PHONE_COUNTRY_CODE }}
      SYNC_REPORT_PATH: report.json
      TOOL_REPO: https://github.com/JustinStafford/eventor-mailchimp-sync
      TOOL_REF: ${{ vars.TOOL_REF || 'main' }}
    steps:
      # Only needed for config.toml; harmless otherwise.
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync
        env:
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply == true }}
          REDACT: ${{ vars.SYNC_REDACT == 'true' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ "$REDACT" = "true" ]; then args+=(--redact); fi
          if [ -f config.toml ]; then args+=(--config config.toml); fi
          uvx --from "git+${TOOL_REPO}@${TOOL_REF}" eventor-mailchimp-sync sync "${args[@]}"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_number }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 14
